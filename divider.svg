<svg width="1000" height="20" viewBox="0 0 1000 20" fill="none" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="0" y="9" width="1000" height="2" fill="url(#g)" fill-opacity="0.7"/>
  <circle r="5" cy="10" fill="#5EEAD4" filter="url(#glow)">
    <animate attributeName="cx" values="100;900;100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" cy="10" fill="#FFFFFF">
    <animate attributeName="cx" values="100;900;100" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
