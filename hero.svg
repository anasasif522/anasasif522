<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mian Anas Asif, WordPress Developer from Lahore, Pakistan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#131A2B"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="frame">
      <rect width="1000" height="300" rx="20"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }

    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s; }
    .d2 { animation-delay: .40s; }
    .d3 { animation-delay: .70s; }
    .d4 { animation-delay: 1.0s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .o1 { animation: o1 10s ease-in-out infinite alternate; }
    .o2 { animation: o2 12s ease-in-out infinite alternate; }
    @keyframes o1 { to { transform: translate(70px, 40px); } }
    @keyframes o2 { to { transform: translate(-80px, -30px); } }

    .spin  { transform-box: fill-box; transform-origin: center; animation: spin 28s linear infinite; }
    .spinr { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite reverse; }
    .orbit { transform-box: view-box; transform-origin: 815px 150px; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .line { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.4s .9s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .2; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <g filter="url(#soft)">
      <circle class="o1" cx="180" cy="60" r="110" fill="#5EEAD4" fill-opacity="0.22"/>
      <circle class="o2" cx="860" cy="250" r="130" fill="#A78BFA" fill-opacity="0.26"/>
    </g>

    <!-- Orbital emblem -->
    <circle class="spin" cx="815" cy="150" r="104" stroke="url(#ac)" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="3 9"/>
    <circle class="spinr" cx="815" cy="150" r="74" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="40 14 4 14"/>
    <circle cx="815" cy="150" r="46" fill="#0A0E17" fill-opacity=".75" stroke="url(#ac)" stroke-width="1.5"/>
    <text class="mono" x="815" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="url(#ac)">&lt;/&gt;</text>
    <g class="orbit">
      <circle cx="815" cy="46" r="5" fill="#5EEAD4"/>
    </g>

    <!-- Copy -->
    <circle class="pulse" cx="68" cy="80" r="4" fill="#5EEAD4"/>
    <text class="rise d1 mono" x="84" y="85" font-size="12.5" letter-spacing="4" fill="#5EEAD4">WORDPRESS DEVELOPER</text>

    <text class="rise d2" x="64" y="158" font-size="60" font-weight="800" letter-spacing="-1" fill="url(#ac)">Mian Anas Asif</text>

    <text class="rise d3" x="64" y="198" font-size="17" fill="#A3ABBA">Crafting WordPress experiences that link businesses to the world.</text>

    <path class="line" d="M64 222H324" stroke="url(#ac)" stroke-width="2" stroke-linecap="round"/>

    <text class="rise d4 mono" x="64" y="260" font-size="12" fill="#6B7280">Lahore, Pakistan  ·  BS Computer Science, Superior University  ·  2024–2028</text>
  </g>

  <rect x=".5" y=".5" width="999" height="299" rx="19.5" stroke="url(#ac)" stroke-opacity=".35"/>
</svg>
